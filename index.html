<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>无妄塔罗 · WU WANG TAROT</title>
<meta name="description" content="无妄塔罗：78 张牌、五种牌阵的纯本地塔罗占卜。抽牌、解读与记录都留在你的浏览器里，无后端、无账号、无请求。">
<meta name="theme-color" content="#F4F1EA">
<meta name="color-scheme" content="light">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="无妄塔罗 · WU WANG TAROT">
<meta property="og:description" content="78 张牌、五种牌阵，纯本地的塔罗占卜。抽牌、解读与记录都留在你的浏览器里。">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="无妄塔罗 · WU WANG TAROT">
<meta name="twitter:description" content="78 张牌、五种牌阵，纯本地的塔罗占卜。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1EA; --raise:#FBFAF6; --slot:#EFEBE1;
  --ink:#191715; --soft:#5C554D; --faint:#8E867B; --faintest:#AFA593;
  --line:#E0D9CD; --line2:#C9BFB0; --acc:#8A3324;
  --back:#EDE7DB; --backLine:#C6BCA9;
  --serif:"Noto Serif SC","Songti SC","Source Han Serif SC",serif;
  --sans:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"Inter",ui-monospace,SFMono-Regular,Menlo,monospace;
  --px:clamp(20px,3.4vw,64px);
  --py:clamp(18px,2.6vh,40px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.7; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility; min-height:100%;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
img{display:block;max-width:100%}
::selection{background:#e7d9d0}

/* ---------- shell ---------- */
.page{
  width:100%; max-width:1920px; margin:0 auto;
  padding:var(--py) var(--px);
  display:flex; flex-direction:column; min-height:100dvh;
}
@media(min-width:900px){
  .page{height:100dvh; overflow:hidden}
  .page.result,.page.history{height:100dvh; overflow-y:auto; overflow-x:hidden}
  .page.result::-webkit-scrollbar,.page.history::-webkit-scrollbar{width:10px}
  .page.result::-webkit-scrollbar-thumb,.page.history::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px}
  .page.result::-webkit-scrollbar-track,.page.history::-webkit-scrollbar-track{background:transparent}
}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.tb-brand{display:flex;flex-direction:column;gap:4px}
.tb-brand b{font-family:var(--serif);font-size:clamp(18px,1.5vw,23px);font-weight:500;letter-spacing:.3em;line-height:1.2}
.tb-brand span{font-family:var(--mono);font-size:7px;letter-spacing:.25em;color:var(--faint)}
.tb-left{display:flex;align-items:center;gap:14px;min-width:0}
.tb-title{font-family:var(--serif);font-size:11px;letter-spacing:.18em;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-step{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--faint);white-space:nowrap}
.back{font-size:15px;line-height:1;color:var(--soft);padding:6px 8px 6px 0}
.back:hover{color:var(--ink)}
.nav{display:flex;align-items:center;gap:clamp(18px,2vw,36px)}
.nav button{font-size:clamp(11px,1vw,13px);letter-spacing:.16em;color:var(--soft)}
.nav button:hover{color:var(--ink)}

.foot{margin-top:auto;padding-top:14px}
.footline{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  font-size:10px;letter-spacing:.14em;color:var(--faint);
}
.footline .v{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em}
.footbar{border-top:1px solid var(--line);padding-top:16px;margin-top:auto}

/* ---------- type ---------- */
.display{font-family:var(--serif);font-weight:400;font-size:clamp(24px,3vw,42px);line-height:1.45;letter-spacing:.03em}
.h2{font-family:var(--serif);font-weight:400;font-size:clamp(22px,2.2vw,34px);letter-spacing:.1em;line-height:1.35}
.h3{font-family:var(--serif);font-weight:400;font-size:16px;letter-spacing:.12em}
.lead{font-size:clamp(12.5px,1vw,15px);line-height:1.95;color:var(--soft);max-width:54ch}
.small{font-size:11.5px;line-height:1.9;color:var(--soft)}
.mini{font-size:9.5px;letter-spacing:.1em;color:var(--faint)}
.eyebrow{font-size:9px;letter-spacing:.22em;color:var(--acc);text-transform:uppercase;white-space:nowrap}

.tag{display:flex;align-items:center;gap:10px}
.tag i{display:block;width:clamp(14px,1.6vw,24px);height:1px;background:var(--acc);flex:none}
.tag span{font-size:10px;letter-spacing:.24em;color:var(--acc)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:clamp(13px,1.6vh,17px) clamp(20px,2vw,30px);
  font-size:clamp(12px,1.05vw,14px);letter-spacing:.22em;line-height:1.2;
  background:var(--ink);color:var(--paper);border-radius:2px;
  transition:background .18s ease,opacity .18s ease;
}
.btn:hover{background:#000}
.btn:disabled{opacity:.28;cursor:not-allowed}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.ghost:hover{background:rgba(25,23,21,.05)}
.btn.plain{background:transparent;color:var(--soft);border:1px solid var(--line2);font-size:12px;letter-spacing:.16em;padding:13px 22px}
.btn.plain:hover{color:var(--ink);border-color:var(--ink)}
.btn-link{font-size:10.5px;letter-spacing:.08em;color:var(--faint);padding:6px 0}
.btn-link:hover{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px clamp(16px,2vw,30px)}

/* ---------- home ---------- */
.home-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(16px,2.6vh,32px);padding:clamp(14px,3vh,36px) 0}
.hero{display:flex;flex-direction:column;gap:clamp(10px,1.6vh,18px)}
@media(min-width:900px){
  .home-main{justify-content:center;gap:clamp(22px,3.2vh,38px);padding:0}
  .home-main .display{font-size:clamp(26px,3.2vw,46px);line-height:1.45}
}
.home-main .spread-list{flex:none}

/* ---------- card back / face ---------- */
.card-face{
  position:relative;aspect-ratio:1/1.72;width:100%;
  background:var(--slot);border:1px solid var(--line2);border-radius:3px;overflow:hidden;
}
.card-face .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:8px;letter-spacing:.3em;color:#A79D8C}
.card-face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card.is-rev .card-face img{transform:rotate(180deg)}

figure.card{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.cap{display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center}
figure.card.left .cap{align-items:flex-start;text-align:left}
.c-name{font-family:var(--serif);font-size:clamp(11.5px,1.05vw,15px);letter-spacing:.12em;line-height:1.45}
.c-latin{font-family:var(--mono);font-size:clamp(5.5px,.5vw,7.5px);letter-spacing:.1em;color:var(--faintest);text-transform:uppercase}
.c-meta{display:flex;align-items:center;gap:5px;font-size:clamp(8px,.75vw,10px);letter-spacing:.06em}
.c-meta .pos{color:var(--soft);letter-spacing:.1em}
.c-meta .rev{color:var(--acc)}
.c-meta i{font-style:normal;color:var(--faintest);font-size:.85em}
.c-meta .arc{font-size:.85em;color:var(--faint)}

/* ---------- spread list ---------- */
.head{display:flex;flex-direction:column;gap:8px;padding:clamp(20px,4vh,40px) 0 clamp(16px,2.6vh,30px)}
@media(min-width:900px){
  .head{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:24px}
}
.spread-body{display:flex;flex-direction:column}
@media(min-width:900px){.spread-body{flex:1;min-height:0;justify-content:center;padding-bottom:clamp(10px,2vh,24px)}}
.spread-list{display:flex;flex-direction:column}
.spread-row{
  display:flex;gap:12px;text-align:left;width:100%;
  padding:clamp(15px,2vh,22px) 0;border-bottom:1px solid var(--line);
  transition:background .18s ease,border-color .18s ease;
}
.spread-row .sr-top{display:flex;align-items:center;gap:6px;padding-top:4px;flex:none}
.spread-row .sr-num{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint)}
.spread-row .dot{width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:0;transition:opacity .18s}
.spread-row .sr-body{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.spread-row .sr-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.spread-row .sr-name{font-family:var(--serif);font-size:clamp(16px,1.5vw,21px);letter-spacing:.1em;line-height:1.4}
.spread-row .sr-count{font-size:10px;color:var(--faint);white-space:nowrap}
.spread-row .sr-desc{font-size:12px;line-height:1.75;color:var(--soft)}
.spread-row.is-on{background:var(--raise)}
.spread-row.is-on .dot{opacity:1}
.spread-row.is-on .sr-num{color:var(--acc)}
@media(min-width:900px){
  .spread-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(10px,1.3vw,20px)}
  .spread-row{flex-direction:column;height:clamp(150px,21vh,200px);padding:clamp(18px,2.2vh,26px) clamp(15px,1.6vw,24px);border:1px solid var(--line);border-radius:2px;gap:0}
  .spread-row .sr-top{justify-content:space-between;padding:0}
  .spread-row .sr-body{flex:1;justify-content:space-between;gap:14px;margin-top:clamp(14px,2vh,22px)}
  .spread-row .sr-line{align-items:flex-start;flex-direction:column;gap:6px}
  .spread-row .sr-count{font-size:10.5px}
  .spread-row .sr-name{font-size:clamp(15px,1.42vw,21px);letter-spacing:.06em}
  .spread-row .sr-desc{font-size:clamp(11.5px,1vw,13px);line-height:1.8}
  .spread-row.is-on{border-color:var(--ink);background:var(--back)}
  .spread-row:hover{border-color:var(--line2)}
  .spread-row.is-on:hover{border-color:var(--ink)}
}

.spread-foot{display:flex;flex-direction:column;align-items:stretch;gap:12px}
.spread-foot .btn{width:100%;padding:14px 20px;letter-spacing:.16em}
.spread-foot .sum{font-size:10.5px;letter-spacing:.08em;color:var(--faint)}
@media(min-width:900px){
  .spread-foot{flex-direction:row;align-items:center;justify-content:space-between}
  .spread-foot .btn{width:auto}
}
.only-sm{display:inline}
.hide-sm{display:none}
@media(min-width:900px){.only-sm{display:none}.hide-sm{display:inline}}

/* ---------- inline question on draw ---------- */
.q-input{
  width:100%;display:block;resize:none;overflow:hidden;
  font-family:var(--serif);font-size:clamp(16px,1.55vw,23px);line-height:1.55;letter-spacing:.06em;
  color:var(--ink);background:transparent;border:0;padding:2px 0 6px;border-radius:0;
  min-height:1.55em;
}
.q-input::placeholder{color:#B5AB99;letter-spacing:.06em}
.q-input:focus{outline:0}
.q-block{padding-bottom:10px;border-bottom:1px solid var(--line);transition:border-color .2s}
.q-block:focus-within{border-bottom-color:var(--ink)}

/* ---------- draw ---------- */
.page.draw.is-num{height:100dvh;overflow:hidden}
.draw-layout{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(14px,2vh,24px);padding-top:clamp(20px,5vh,44px)}
.rail{display:flex;flex-direction:column;gap:clamp(16px,2.4vh,30px);min-height:0;flex:none}
.q-block .lab{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rule{height:1px;background:var(--line)}
.method-box{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:#EAE4D8;border-radius:2px;padding:3px}
.seg button{
  flex:1;padding:clamp(8px,1.2vh,11px) 6px;font-size:clamp(10.5px,.9vw,12px);letter-spacing:.16em;color:var(--soft);
  border-radius:1px;transition:background .18s,color .18s;
}
.seg button.is-on{background:var(--ink);color:var(--paper)}

.stage-wrap.compact{flex:1 1 auto;min-height:0}
.stage-wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,1.8vh,22px);width:100%;min-height:0;flex:0 1 auto;
  background:var(--raise);border:1px solid #E2DACB;border-radius:2px;
  padding:clamp(14px,2.4vh,34px) clamp(14px,1.8vw,34px);
}
.slots{
  display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));
  gap:10px;width:100%;max-width:340px;justify-items:center;
}
.slot-col{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;max-width:104px;min-height:0}
.slots.ab-layout{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.6vh,18px);max-width:100%}
.ab-pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,3vw,34px);width:min(100%,430px);justify-items:center}
.ab-pair{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.6vh,18px);width:100%}
.ab-layout .slot-col{max-width:min(78px,11vh)}
.slot-col.wide{grid-column:1/-1;justify-self:center}
.stage-wrap.compact .slots{flex:none}
.stage-wrap.compact{overflow-y:auto;overflow-x:hidden;justify-content:flex-start;scrollbar-width:none;overscroll-behavior:contain}
.stage-wrap.compact::-webkit-scrollbar{display:none;width:0;height:0}
.stage-wrap.compact .numgrid-wrap{flex:none}
.stage-wrap.compact .slot-col{max-width:min(84px,13vh)}

.slot{
  position:relative;width:100%;aspect-ratio:1/1.72;display:grid;place-items:center;
  background:var(--slot);border:1px solid #C0B5A3;border-radius:2px;flex:none;
}
.slot i{display:block;width:14px;height:14px;border-radius:50%;border:1.5px solid #C6BAA7}
.slot-label{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.18em;color:var(--faint);white-space:nowrap}
.slot-label b{font-family:var(--mono);font-weight:400;font-size:8.5px;color:#B0A695}
.stage-note{font-size:11px;line-height:1.8;color:var(--soft);text-align:center;max-width:100%;flex:none}

.numgrid-wrap{
  width:100%;display:flex;justify-content:center;align-items:flex-start;padding:2px 2px 6px;
}
.numgrid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(6px,.9vw,11px);
  width:100%;max-width:min(100%,540px);margin:0 auto;align-content:start;
}
.mini-card{
  position:relative;display:grid;place-items:center;width:100%;height:auto;aspect-ratio:1/1.58;
  background:var(--back);border:1px solid var(--backLine);border-radius:3px;
  font-family:var(--mono);font-size:clamp(11px,1.05vw,15px);letter-spacing:.06em;color:var(--soft);
  transition:background .15s,border-color .15s,color .15s;
}
.mini-card::before{content:"";position:absolute;inset:4px;border:1px solid rgba(198,188,169,.55);border-radius:2px;pointer-events:none}
.mini-card:hover{border-color:#A79C88}
.mini-card.is-on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.mini-card.is-on:hover{border-color:var(--ink)}

.rail-actions{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.rail-actions .note{font-size:9.5px;color:var(--faint);text-align:center;line-height:1.7}

@media(min-width:900px){
  .draw-layout{
    display:grid;
    grid-template-columns:minmax(260px,24vw) minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) auto;
    grid-template-areas:"rail stage" "actions stage";
    gap:0 clamp(24px,3vw,56px);
    padding-top:clamp(14px,2vh,26px);
  }
  .rail{grid-area:rail}
  .rail-actions{grid-area:actions;align-self:end;padding-top:clamp(20px,3vh,44px)}
  .stage-wrap{grid-area:stage;height:auto;max-height:100%;align-self:center;width:100%;max-width:780px;justify-self:center;
    justify-content:center;padding:clamp(16px,2.6vh,34px) clamp(16px,2vw,38px)}
  .stage-wrap.compact{height:100%;flex:1 1 auto}
  .slots{flex:0 1 auto;min-height:0;max-width:none;align-content:center;align-items:center;
    gap:clamp(16px,2.4vw,44px)}
  .slot-col{max-width:min(clamp(130px,17vw,230px),32vh);height:auto;min-height:0}
  .ab-layout .slot-col{max-width:min(110px,13vh)}
  .slot{width:100%;height:auto;flex:none}
  .slot i{width:clamp(14px,1.5vw,20px);height:clamp(14px,1.5vw,20px)}
  .stage-wrap.compact .slots{flex:0 0 auto;align-content:center}
  .stage-wrap.compact .slot-col{max-width:min(clamp(64px,7vw,104px),15vh)}
  .numgrid{max-width:min(100%,560px)}
}

/* ---------- result ---------- */
.result-layout{flex:1;display:flex;flex-direction:column;gap:clamp(26px,4vh,40px);padding-top:clamp(12px,2vh,26px)}
.cards-area{display:flex;flex-direction:column;gap:clamp(20px,3vh,32px);min-width:0;--ab-gap:clamp(16px,2vw,28px)}
.r-head{display:flex;flex-direction:column;gap:10px}
.r-head .q{font-family:var(--serif);font-size:clamp(17px,1.7vw,28px);line-height:1.55;letter-spacing:.05em}
.r-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:9.5px;letter-spacing:.08em;color:var(--faint)}
.r-meta .t{font-family:var(--mono);font-size:9px}
.grp-label{display:flex;align-items:center;gap:10px;margin-bottom:clamp(10px,1.6vh,16px)}
.grp-label span{font-family:var(--serif);font-size:11px;letter-spacing:.28em;color:var(--acc);white-space:nowrap}
.grp-label i{flex:1;height:1px;background:var(--line)}
.grp{display:flex;flex-direction:column}
.cards-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.4vw,20px);max-width:min(100%,820px);justify-items:center}
.cards-3 figure.card{width:100%;max-width:min(100%,31vh)}
.cards-ab figure.card,.cur-wrap figure.card{max-width:min(100%,31vh)}
.cards-1{display:flex;justify-content:center}
.cards-1 figure.card{width:min(260px,62%);max-width:31vh}
.col{min-width:0;display:flex;flex-direction:column}
.cards-ab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--ab-gap);max-width:min(100%,820px)}
.ab-col{display:flex;flex-direction:column;gap:0;min-width:0}
.ab-head{display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.ab-badge{width:18px;height:18px;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:9px;border-radius:1px;flex:none}
.ab-title{font-family:var(--serif);font-size:clamp(12px,1.05vw,15px);letter-spacing:.1em}
.stage-sub{font-size:8.5px;letter-spacing:.28em;color:var(--faint);margin-bottom:8px}
.ab-note{font-size:clamp(11px,.95vw,12.5px);line-height:1.85;color:var(--soft);margin-top:10px}
.ab-col .block + .block{margin-top:clamp(16px,2.4vh,26px)}
.cur-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:clamp(20px,3vh,32px)}
.cur-wrap figure.card{width:calc((100% - var(--ab-gap)) / 2);max-width:min(100%,31vh)}

.reading{display:flex;flex-direction:column;gap:clamp(20px,3vh,30px);min-width:0}
.r-block{display:flex;flex-direction:column;gap:12px}
.r-block > .body{font-size:clamp(12px,1vw,13.5px);line-height:2.05;color:var(--soft);white-space:pre-line}
.read-title{display:flex;align-items:center;gap:10px}
.read-title span{font-size:9.5px;letter-spacing:.28em;color:var(--acc);white-space:nowrap}
.read-title i{flex:1;height:1px;background:var(--line)}

  id:"major-"+String(i).padStart(2,"0"), arcana:"major", num:i,
  name:m[0], nameEn:m[1], up:m[2], rev:m[3]
}));
SUITS.forEach(([key,cn,en,list])=>{
  list.forEach((m,i)=>{
    const n=i+1;
    CARDS.push({
      id:key+"-"+RANK_ID[i], arcana:"minor", suit:key, num:n,
      name:cn+RANKS[i],

const USE_IMAGES = true;
const arcanaName = c => c.arcana==="major" ? "大阿尔卡纳" : "小阿尔卡纳";

/* ---------- 2. 牌阵 ---------- */
const SPREADS = [
{ id:"single", name:"一张牌", count:1,

  desc:"先看现状，再看两条路各自的发展与结果。",
  slots:[{label:"现状"},{label:"发展",g:"A"},{label:"结果",g:"A"},{label:"发展",g:"B"},{label:"结果",g:"B"}],

  desc:"三张写你的预设，三张写事情本来的样子。",

    {label:"01",g:"我以为"},{label:"02",g:"我以为"},{label:"03",g:"我以为"},
    {label:"01",g:"实际上"},{label:"02",g:"实际上"},{label:"03",g:"实际上"}
  ], diagram:[[1,1,1],[1,1,1]] }
];
const spreadById = id => SPREADS.find(s=>s.id===id);

/* ---------- 3. 状态 ---------- */
const S = {
  view:"home", spreadId:null, question:"", method:"random",
  deck:[], drawn:[], picked:[], result:null, notes:false
};
const app = document.getElementById("app");
const HIST_KEY = "wuwang:history";

const shuffle = arr => {
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
};
const buildDeck = () => shuffle(CARDS).map(card=>({card, reversed:Math.random()<.5}));
const pad = n => String(n).padStart(2,"0");
const fmtDate = ts => {
  const d = new Date(ts);
  return `${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const fmtFull = ts => {
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function readHistory(){
  try{ return JSON.parse(localStorage.getItem(HIST_KEY)||"[]"); }catch(e){ return []; }
}
function writeHistory(list){
  try{ localStorage.setItem(HIST_KEY, JSON.stringify(list)); }catch(e){}
}
function upsertHistory(rec){
  const h = readHistory().filter(x=>x.id !== rec.id);
  h.unshift(rec);
  writeHistory(h);
}

/* ---------- 4. 组件片段 ---------- */
function cardHTML(item, opt={}){
  const {card,reversed} = item;
  const left = opt.align === "left";
  const cap = opt.caption !== false;
  const img = USE_IMAGES
    ? `<img src="cards/${card.id}.webp" alt="${esc(card.name)}" loading="lazy"
        onerror="this.remove()">`
    : "";
  return `<figure class="card ${reversed?"is-rev":""} ${left?"left":""}">
    <div class="card-face"><span class="ph">牌面</span>${img}</div>
    ${cap ? `<figcaption class="cap">
      <span class="c-name">${esc(card.name)}</span>
      <span class="c-latin">${esc(card.nameEn)}</span>
      <span class="c-meta"><b class="pos ${reversed?"rev":""}">${reversed?"逆位":"正位"}</b><i>·</i><span class="arc">${arcanaName(card)}</span></span>
    </figcaption>` : ""}
  </figure>`;
}

  ? `${sp.slots[i].g} · ${sp.slots[i].label}`
  : (sp.slots[i].g ? `${sp.slots[i].g} ${sp.slots[i].label}` : sp.slots[i].label || `第 ${i+1} 张`);

const numNote = sp => {
  const p = S.picked.length;
  return p === sp.count
    ? `已选 ${p} / ${sp.count} · 确认后翻牌`
    : `已选 ${p} / ${sp.count} · 还需要再选 ${sp.count-p} 张`;
};

  const one = (i)=>{
    const sl = sp.slots[i];
    const filled = S.drawn[i] ? cardHTML(S.drawn[i]) : "";
    return `<div class="slot-col">
      ${S.drawn[i] ? filled : `<div class="slot"><i></i></div>`}
      ${sl.label?`<span class="slot-label">${sl.g && sp.id!=="expect"?`<b>${sl.g}</b>`:""}${esc(sl.label)}</span>`:""}
    </div>`;
  };
  if(sp.id === "ab"){
    return `<div class="slots ab-layout">
      ${one(0)}
      <div class="ab-pairs">
        <div class="ab-pair">${one(1)}${one(2)}</div>
        <div class="ab-pair">${one(3)}${one(4)}</div>
      </div>
    </div>`;
  }
  return `<div class="slots" style="--cols:${cols}">${sp.slots.map((sl,i)=>one(i)).join("")}</div>`;
}

function buildReading(res){
  const sp = spreadById(res.spreadId);
  const cards = res.cards.map(d=>d);
  const n = cards.length;
  const up = cards.filter(c=>!c.reversed).length;
  const countTxt = `${up} 张正位、${n-up} 张逆位`;
  const A = res.cards.map((d,i)=>`「${d.card.name}」`);

  let overall = "";
  if(sp.id === "single"){
    const d = cards[0];
    overall = `这次只翻了一张牌：${A[0]}，${d.reversed?"逆位":"正位"}。\n单张牌适合看一个明确的问题。它说明的是此刻的核心状态，而不是最终结果 —— 先把它当成一个提示。`;
  }else if(sp.id === "three"){
    overall = `三张牌依次是${A.join("、")}。这组没有位置含义，所以先别急着逐张解释：看它们的共同点，也看它们互相顶着的部分。\n${countTxt}。`;
  }else if(sp.id === "timeline"){
    overall = `过去是${A[0]}，当下是${A[1]}，未来是${A[2]}。${countTxt}。\n牌给的是条件与倾向，不是判决。把它当成一次复盘的提示，比当成预言更有用。`;
  }else if(sp.id === "ab"){
    const ra = cards[2], rb = cards[4];
    let cmp;
    if(!ra.reversed && !rb.reversed) cmp = "两条路的落点都是正位，说明两个方向都还有可走的空间。";
    else if(ra.reversed && rb.reversed) cmp = "两个落点都是逆位，说明此刻两条路都不轻，先把条件看清再动。";
    else cmp = "两个落点一正一逆。更顺的那条未必更好，要看它是否与你的价值一致。";
    overall = `现状是${A[0]}；A 路的发展是${A[1]}、结果是${A[2]}；B 路的发展是${A[3]}、结果是${A[4]}。\n${cmp}\n两条路的代价不同，真正要问的不是哪条更安全，而是哪一种代价你更愿意付。`;
  }else if(sp.id === "expect"){
    const pre = cards.slice(0,3).filter(c=>!c.reversed).length;
    const act = cards.slice(3,6).filter(c=>!c.reversed).length;
    overall = `前一组三张是你「以为」的版本，其中 ${pre} 张正位；后一组三张是牌看到的实际样子，其中 ${act} 张正位。\n两组之间的落差，比任何单张牌都值得看：先读前一组，再读后一组，注意它们在哪里打架。`;
  }

  const items = res.cards.map((d,i)=>{
    const sp2 = sp;
    return `<div class="item">
      <div class="ih">
        <span class="nm"><b>${esc(d.card.name)}</b><em class="${d.reversed?"rev":""}">${d.reversed?"逆位":"正位"}</em></span>
        <span class="pos">${esc(slotName(sp2,i))}</span>
      </div>
      <p class="txt">${esc(d.reversed ? d.card.rev : d.card.up)}</p>
    </div>`;
  }).join("");

  return {overall, items};
}

function cardsArea(res){
  const sp = spreadById(res.spreadId);
  const c = res.cards;

  if(sp.id === "single") return `<div class="cards-1">${cardHTML(c[0])}</div>`;

  if(sp.id === "three" || sp.id === "timeline"){
    const heads = sp.id === "timeline";
    return `<div class="grp">
      ${heads ? `<div class="grp-label"><span>过去 · 现在 · 未来</span><i></i></div>` : ""}
      <div class="cards-3">${c.map((d,i)=>heads?`
        <div class="col">
          <div class="slot-label" style="margin-bottom:10px"><b>0${i+1}</b>${esc(sp.slots[i].label)}</div>
          ${cardHTML(d)}
        </div>` : cardHTML(d)).join("")}</div>
    </div>`;
  }

  if(sp.id === "ab"){
    const A = [[c[1],1],[c[2],2]], B = [[c[3],3],[c[4],4]];
    const col = (letter,title,list)=>`
      <div class="ab-col">
        <div class="ab-head"><span class="ab-badge">${letter}</span><span class="ab-title">${title}</span></div>
        ${list.map(([d,i])=>`<div class="block">
          <div class="stage-sub">${esc(sp.slots[i].label)}</div>
          ${cardHTML(d,{caption:true})}
          <p class="ab-note">${esc(d.reversed?d.card.rev:d.card.up)}</p>
        </div>`).join("")}
      </div>`;
    return `<div class="cur-wrap">
        <div class="grp-label" style="width:100%;margin-bottom:0"><i></i><span>现 状</span><i></i></div>
        ${cardHTML(c[0])}
        <p class="ab-note" style="text-align:center;max-width:230px">${esc(c[0].reversed?c[0].card.rev:c[0].card.up)}</p>
      </div>
      <div class="cards-ab">${col("A","选项 A",A)}${col("B","选项 B",B)}</div>`;
  }

  const pre = c.slice(0,3), act = c.slice(3,6);
  const row = (list)=>`<div class="cards-3">${list.map(d=>cardHTML(d)).join("")}</div>`;
  return `<div class="grp"><div class="grp-label"><span>我以为</span><i></i></div>${row(pre)}</div>
    <div class="grp" style="margin-top:26px"><div class="grp-label"><span>实际上</span><i></i></div>${row(act)}</div>`;
}

function viewHistory(){
  const h = readHistory();
  const rows = h.map(rec=>{
    const sp = spreadById(rec.spreadId) || {name:"牌阵", count: rec.cards.length, slots:[]};
    const cards = rec.cards.map((c,i)=>{
      const card = CARDS.find(x=>x.id===c.id);
      if(!card) return "";
      const lb = (sp.slots && sp.slots[i]) ? slotName(sp,i) : "";
      const img = USE_IMAGES ? `<img src="cards/${card.id}.webp" alt="" loading="lazy" class="${c.r?"rev":""}" onerror="this.remove()">` : "";
      return `<li><span class="h-thumb">${img}</span><span class="h-meta">${lb?`<span>${esc(lb)}</span>`:""}<b>${esc(card.name)}</b><em class="${c.r?"rev":""}">${c.r?"逆":"正"}</em></span></li>`;
    }).join("");
    const id = rec.id || rec.at;
    return `<article class="h-row">
      <div class="h-top"><span class="d">${fmtFull(rec.at)}</span><span>${esc(sp.name)} · ${rec.cards.length} 张</span></div>
      <p class="h-q">${rec.question?esc(rec.question):"（未写下问题）"}</p>

  }).join("");

  return `<div class="page history">
    <header class="topbar">
      <div class="tb-left"><button class="back" data-act="home">←</button><span class="tb-title">历史记录</span></div>

      <div><h2 class="h2">历史记录</h2><p class="lead" style="margin-top:8px">保存过的结果都留在这台设备上。导出的备份只有你自己看得到，可以换台设备再导入。</p></div>
      <div class="h-tools">
        <button data-act="export-hist">导出</button>

    <div class="history-body">
      ${h.length ? rows : `<div class="h-empty">
        <p class="small">还没有保存过结果。<br>抽完一次牌，点「保存并复制」或「问问别的」，就会留在这里。</p>

    </div>
    ${h.length ? `<footer class="foot"><div class="footline" style="border-top:1px solid var(--line);padding-top:16px"><span>共 ${h.length} 条 · 只保存在本机</span><span class="v">JSON</span></div></footer>` : ""}
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </div>`;
}

const NOTES = [
["01","一张牌，不是一个结论","请不要在看到单张牌呈负面或逆位状态时，就根据简略牌意片面理解它的整体状态。如果目前还无法准确分析牌与牌之间的关系与结构，请寻求 AI 辅助或专业人士的帮助。"],
["02","未来不是判决书","牌对于未来的预测与推演，可能仅基于当下已经存在的因素。对未来的理解和态度不同，事情的发展与结果也会随之变化。请积极地面对牌的建议，而非把它奉为神谕。"],
["03","先守住内心的安宁","无论是对牌面的理解，还是依据牌去调整自己，都需要平静、精进而不失客观的内心。因此在看牌的过程中，守护自身的内在安宁是一要务。"]
];

/* ---------- 6. 渲染 ---------- */
function render(){
  let html = "";
  if(S.view === "home") html = viewHome();
  else if(S.view === "draw") html = viewDraw();
  else if(S.view === "result") html = viewResult();
  else if(S.view === "history") html = viewHistory();
  if(S.notes) html += sheetNotes(S.notes);
  if(S.pending) html += sheetConfirm();
  const prev = document.querySelector("[data-scroll]");
  const keepTop = prev ? prev.scrollTop : 0;
  const changed = render.lastView !== S.view;
  app.innerHTML = html;
  render.lastView = S.view;
  if(keepTop){
    const next = document.querySelector("[data-scroll]");
    if(next) next.scrollTop = keepTop;
  }
  if(changed) window.scrollTo(0,0);
  const ta = document.getElementById("q");
  if(ta){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }
}

/* ---------- 7. 动作 ---------- */
function startDraw(){
  S.deck = buildDeck();
  S.drawn = [];
  S.picked = [];
  S.method = "random";
  S.view = "draw";
  render();
}
function finish(cards){
  const at = Date.now();
  const res = {
    id: at, at,
    spreadId: S.spreadId, question: S.question.trim(),
    cards
  };
  S.result = res;
  S.view = "result";
  render();
}

function exportHistory(){
  const data = { app:"wuwang-tarot", version:1, exportedAt:new Date().toISOString(), items: readHistory() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const a = document.createElement("a");
  a.href = url;
  a.download = "无妄塔罗-记录-" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast("已导出 " + data.items.length + " 条");
}
function importHistory(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const raw = JSON.parse(String(reader.result));
      const items = Array.isArray(raw) ? raw : (raw && raw.items) || [];
      const clean = items
        .filter(x=>x && x.spreadId && Array.isArray(x.cards) && spreadById(x.spreadId))
        .map(x=>({
          id: x.id || x.at || (Date.now() + Math.floor(Math.random()*1000)),
          at: x.at || Date.now(),
          spreadId: x.spreadId,
          question: x.question || "",
          cards: x.cards.filter(c=>c && c.id).map(c=>({id:c.id, r:!!c.r}))
        }))
        .filter(x=>x.cards.length);
      if(!clean.length){ toast("没有可导入的记录"); return; }
      const cur = readHistory();
      const ids = new Set(cur.map(x=>String(x.id)));
      let n = 0;
      for(const it of clean){ if(!ids.has(String(it.id))){ cur.push(it); n++; } }
      cur.sort((a,b)=>b.at - a.at);
      writeHistory(cur);
      render();
      toast(n ? "已导入 " + n + " 条" : "记录已存在，没有新增");
    }catch(e){ toast("文件格式不对，导入失败"); }
  };
  reader.readAsText(file);
}
function recordToResult(rec){
  return {
    id: rec.id || rec.at, at: rec.at, spreadId: rec.spreadId, question: rec.question || "", saved: true,
    cards: rec.cards.map(c=>({card: CARDS.find(x=>x.id===c.id), reversed: !!c.r})).filter(c=>c.card)
  };
}
function openHist(id){
  const rec = readHistory().find(x=>String(x.id||x.at)===String(id));
  if(!rec) return;
  S.spreadId = rec.spreadId;
  S.question = rec.question || "";
  S.result = recordToResult(rec);
  S.view = "result";
  render();
}
function toast(msg){
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1800);
}
function summaryText(res){
  res = res || S.result;
  const sp = spreadById(res.spreadId);
  const lines = res.cards.map((d,i)=>`- ${slotName(sp,i)}｜${d.card.name} · ${d.reversed?"逆位":"正位"}`);
  const SEP = String.fromCharCode(10);
  return [
    "请结合以下牌面和问题，用专业又易懂的方式帮助我解牌：",
    "占卜时间：" + fmtFull(res.at),
    "牌阵：" + sp.name + "（" + sp.count + " 张）",
    "我的问题：" + (res.question || "（未填写）"),
    "抽到的牌面：",
    ...lines
  ].join(SEP);
}
function saveResult(){
  const r = S.result;
  if(!r || !r.spreadId) return;
  upsertHistory({
    id: r.id || r.at, at: r.at, spreadId: r.spreadId,
    question: r.question || "",
    cards: r.cards.map(c=>({id:c.card.id, r:c.reversed}))
  });
  r.saved = true;
}
async function copyText(t){
  try{
    await navigator.clipboard.writeText(t);
    return true;
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch(_){}
    ta.remove();
    return ok;
  }
}

app.addEventListener("click", async (e)=>{
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const act = t.dataset.act;
  // 点击面板空白处（事件冒泡到遮罩）不关闭；点真正的按钮才执行
  if(e.target.closest(".sheet-inner") && t.classList.contains("sheet")) return;

  switch(act){
    case "notes": S.notes = "notes"; render(); return;
    case "close-notes": S.notes = false; render(); return;

    case "home": S.view = "home"; render(); return;
    case "to-spread": S.view = "home"; render(); return;
    case "start": S.view = "home"; render(); return;
    case "pick-spread":
      S.spreadId = t.dataset.id; render(); return;
    case "to-draw":
      if(!S.spreadId) return;
      startDraw(); return;

    case "method":
      S.method = t.dataset.m;
      if(S.method === "random") S.picked = [];
      S.drawn = [];
      render(); return;
    case "method-to-num":
      S.method = "number"; S.drawn = []; S.picked = []; render(); return;

    case "pick-num": {
      const n = Number(t.dataset.n);
      const sp = spreadById(S.spreadId);
      const has = S.picked.includes(n);
      if(!has && S.picked.length >= sp.count){ toast("最多只能选 " + sp.count + " 张"); return; }
      S.picked = has ? S.picked.filter(x=>x!==n) : [...S.picked, n];
      const on = !has;
      t.classList.toggle("is-on", on);
      t.setAttribute("aria-pressed", on ? "true" : "false");
      const note = document.querySelector("[data-note]");
      if(note) note.textContent = numNote(sp);
      const cta = document.querySelector('[data-act="confirm-num"]');
      if(cta) cta.disabled = S.picked.length !== sp.count;
      return;
    }
    case "clear-num": S.picked = []; render(); return;
    case "confirm-num": {
      const sp = spreadById(S.spreadId);
      if(S.picked.length !== sp.count) return;
      const nums = S.picked.slice().sort((a,b)=>a-b);
      finish(nums.map(n=>S.deck[n-1]));
      return;
    }
    case "draw-random": {
      const sp = spreadById(S.spreadId);
      finish(S.deck.slice(0, sp.count));
      return;
    }
    case "again":
      startDraw(); return;
    case "history": S.view = "history"; render(); return;
    case "open-hist": openHist(t.dataset.id); return;
    case "copy-hist": {
      const rec = readHistory().find(x=>String(x.id||x.at)===t.dataset.id);
      if(!rec) return;
      const ok = await copyText(summaryText(recordToResult(rec)));
      toast(ok ? "已复制到剪贴板" : "复制失败，请手动选择文本");
      return;
    }
    case "del-hist":
      writeHistory(readHistory().filter(x=>String(x.id||x.at)!==t.dataset.id));
      render(); toast("已删除"); return;
    case "clear-hist":
      if(!readHistory().length){ toast("还没有可清空的记录"); return; }
      S.pending = "clear"; render(); return;
    case "cancel-pending":
      S.pending = null; render(); return;
    case "confirm-clear":
      writeHistory([]); S.pending = null; render(); toast("已清空"); return;
    case "export-hist":
      if(!readHistory().length){ toast("还没有可导出的记录"); return; }
      exportHistory(); return;
    case "import-hist": {
      const input = document.getElementById("import-file");
      if(input) input.click();
      return;
    }
    case "ask-other":
      saveResult();
      S.result = null; S.question = ""; S.spreadId = null; S.method = "random";
      S.deck = []; S.drawn = []; S.picked = [];
      S.view = "home";
      render(); toast("已保存到历史记录"); return;
    case "save": {
      saveResult();
      const ok = await copyText(summaryText());
      toast(ok ? "已保存并复制" : "已保存，但复制失败");
      return;
    }
  }
});

/* 输入监听：只更新计数，不重渲染，避免打断输入 */
document.addEventListener("input", (e)=>{
  const ta = e.target.closest("#q");
  if(!ta) return;
  S.question = ta.value;
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + "px";
});
document.addEventListener("change", (e)=>{
  if(e.target && e.target.id === "import-file"){
    const f = e.target.files && e.target.files[0];
    if(f) importHistory(f);
    e.target.value = "";
  }
});
document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape" && S.pending){ S.pending = null; render(); return; }
  if(e.key === "Escape" && S.notes){ S.notes = false; render(); }
  if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){
    if(S.view === "draw"){
      const sp = spreadById(S.spreadId);
      if(S.method === "random") finish(S.deck.slice(0, sp.count));
      else if(S.picked.length === sp.count){
        finish(S.picked.slice().sort((a,b)=>a-b).map(n=>S.deck[n-1]));
      }
    }
  }
});

/* 预览用：?demo=spread|question|draw|number|result|ab|expect|notes */
(function demo(){
  const d = new URLSearchParams(location.search).get("demo");
  if(!d) return;
  const q = "我该不该接下这份新工作？";
  const seed = (spId, n=null)=>{
    S.spreadId = spId; S.question = q; S.deck = buildDeck(); S.picked = [];
    S.result = {spreadId:spId, question:q, at:Date.now(), cards:S.deck.slice(0,n||spreadById(spId).count)};
  };
  if(d==="reset"){ writeHistory([]); S.view="home"; return; }
  if(d==="confirm"){ S.view="history"; S.pending="clear"; return; }
  if(d==="abdraw"){ S.spreadId="ab"; S.question=q; S.deck=buildDeck(); S.view="draw"; return; }
  if(d==="abnum"){ S.spreadId="ab"; S.question=q; S.deck=buildDeck(); S.method="number"; S.picked=[7,42,63,5,19]; S.view="draw"; return; }
  if(d==="spread"){ S.view="home"; S.spreadId="timeline"; }
  else if(d==="draw"){ S.spreadId="timeline"; S.question=q; S.deck=buildDeck(); S.view="draw"; }
  else if(d==="number"){ S.spreadId="timeline"; S.question=q; S.deck=buildDeck(); S.method="number"; S.picked=[7,42,63]; S.view="draw"; }
  else if(d==="result"){ seed("timeline"); S.view="result"; }
  else if(d==="ab"){ seed("ab"); S.view="result"; }
  else if(d==="expect"){ seed("expect"); S.view="result"; }
  else if(d==="single"){ seed("single"); S.view="result"; }
  else if(d==="notes"){ S.notes="notes"; }
  else if(d==="history"){
    if(!readHistory().length){
      const mk=(spId,days,question)=>{
        const at = Date.now() - days*864e5, sp = spreadById(spId), deck = buildDeck();
        return {id:at, at, spreadId:spId, question,
          cards: deck.slice(0, sp.count).map(c=>({id:c.card.id, r:c.reversed}))};
      };
      writeHistory([
        mk("expect",1,""),
        mk("ab",3,"留在现在的公司，还是去新机会？"),
        mk("timeline",6,"我该不该接下这份新工作？"),
        mk("single",9,"这周我该把力气放在哪里？")
      ]);
    }
    S.view = "history";
  }
})();

render();
</script>
